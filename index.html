<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Grifo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink:     #1a1a2e;
  --bg:      #f0f4f8;
  --card:    #ffffff;
  --border:  #e2e8f0;
  --diesel:  #2563a8;
  --regular: #16a34a;
  --premium: #b45309;
  --ok:      #16a34a;
  --fail:    #dc2626;
  --warn:    #d97706;
  --gray:    #6b7280;
  --mono:    'Courier New', monospace;
}
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; padding-bottom:40px; }

/* Header */
.header { background:var(--ink); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.header-left { display:flex; align-items:center; gap:10px; }
.header-title { font-size:14px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.header-sub { font-size:10px; opacity:.5; margin-top:1px; }
.date-nav { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.1); border-radius:8px; padding:6px 10px; }
.date-nav button { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; padding:0 2px; opacity:.7; line-height:1; }
.date-nav button:hover { opacity:1; }
.date-nav input[type="date"] { background:none; border:none; color:#fff; font-size:12px; font-weight:600; outline:none; cursor:pointer; }
.date-nav input::-webkit-calendar-picker-indicator { filter:invert(1); opacity:.6; }

/* Container */
.container { max-width:600px; margin:0 auto; padding:14px; }

/* State */
.state-msg { text-align:center; padding:60px 20px; color:var(--gray); }
.state-msg .icon { font-size:40px; margin-bottom:10px; }

/* Status banner */
.status-banner { border-radius:12px; padding:14px 18px; margin-bottom:14px; display:flex; align-items:center; gap:12px; }
.status-banner.ok   { background:#dcfce7; border:1.5px solid #86efac; }
.status-banner.fail { background:#fee2e2; border:1.5px solid #fca5a5; }
.status-banner.warn { background:#fef3c7; border:1.5px solid #fde68a; }
.status-icon { font-size:28px; flex-shrink:0; }
.status-text h2 { font-size:15px; font-weight:700; }
.status-text p  { font-size:12px; margin-top:2px; opacity:.7; }
.status-banner.ok   .status-text h2 { color:#15803d; }
.status-banner.fail .status-text h2 { color:var(--fail); }
.status-banner.warn .status-text h2 { color:var(--warn); }

/* Card */
.card { background:var(--card); border-radius:12px; border:1px solid var(--border); margin-bottom:14px; overflow:hidden; }
.card-header { padding:10px 16px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--gray); border-bottom:1px solid var(--border); }
.card-body { padding:16px; }

/* Big number */
.big-number { text-align:center; padding:20px 16px 12px; }
.big-number .label { font-size:11px; color:var(--gray); margin-bottom:4px; letter-spacing:.06em; text-transform:uppercase; }
.big-number .value { font-size:42px; font-weight:800; font-family:var(--mono); color:var(--ink); letter-spacing:-.02em; line-height:1; }

/* Fuel bars */
.fuel-bars { display:flex; flex-direction:column; gap:10px; }
.fuel-row { display:flex; align-items:center; gap:10px; }
.fuel-lbl { font-size:11px; font-weight:700; width:60px; flex-shrink:0; }
.fuel-lbl.diesel  { color:var(--diesel); }
.fuel-lbl.regular { color:var(--regular); }
.fuel-lbl.premium { color:var(--premium); }
.bar-wrap { flex:1; height:10px; background:#f1f5f9; border-radius:5px; overflow:hidden; }
.bar { height:100%; border-radius:5px; transition:width .6s ease; }
.bar.diesel  { background:var(--diesel); }
.bar.regular { background:var(--regular); }
.bar.premium { background:var(--premium); }
.fuel-amt { font-size:12px; font-family:var(--mono); font-weight:600; width:80px; text-align:right; flex-shrink:0; }

/* Galones */
.gal-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.gal-item { text-align:center; padding:12px 8px; background:#f8fafc; border-radius:8px; border:1px solid var(--border); }
.gal-item .gal-label { font-size:10px; font-weight:700; letter-spacing:.06em; margin-bottom:6px; }
.gal-item .gal-label.diesel  { color:var(--diesel); }
.gal-item .gal-label.regular { color:var(--regular); }
.gal-item .gal-label.premium { color:var(--premium); }
.gal-item .gal-val { font-size:18px; font-weight:700; font-family:var(--mono); }
.gal-item .gal-unit { font-size:10px; color:var(--gray); margin-top:2px; }

/* Pagos */
.pagos-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.pago-item { background:#f8fafc; border-radius:8px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border); }
.pago-label { font-size:12px; color:var(--gray); font-weight:600; }
.pago-val   { font-size:14px; font-family:var(--mono); font-weight:700; }
.pago-item.highlight { background:#eff6ff; border-color:#bfdbfe; }
.pago-item.highlight .pago-val { color:var(--diesel); }

/* Turnos */
.turnos-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.turno-card { border-radius:10px; padding:14px; border:1.5px solid var(--border); }
.turno-card.ok   { border-color:#86efac; background:#f0fdf4; }
.turno-card.fail { border-color:#fca5a5; background:#fff5f5; }
.turno-card.empty { background:#f9fafb; }
.turno-title { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px; }
.turno-stat { display:flex; justify-content:space-between; margin-bottom:5px; font-size:12px; }
.turno-stat .lbl { color:var(--gray); }
.turno-stat .val { font-family:var(--mono); font-weight:600; }
.turno-badge { display:inline-block; margin-top:8px; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:700; }
.turno-badge.ok   { background:#dcfce7; color:#15803d; }
.turno-badge.fail { background:#fee2e2; color:var(--fail); }

/* Footer */
.footer { text-align:center; font-size:11px; color:#ccc; margin-top:20px; }

/* ── Tank visuals ── */
.tanks-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.tank-item { display:flex; flex-direction:column; align-items:center; gap:8px; }
.tank-label { font-size:11px; font-weight:700; letter-spacing:.06em; text-align:center; }
.tank-label.diesel  { color:var(--diesel); }
.tank-label.regular { color:var(--regular); }
.tank-label.premium { color:var(--premium); }
.tank-wrap { position:relative; width:70px; height:120px; }
.tank-body {
  width:70px; height:120px; border-radius:8px;
  border:2px solid #cbd5e1; background:#f1f5f9;
  overflow:hidden; position:relative;
}
.tank-fill {
  position:absolute; bottom:0; left:0; right:0;
  border-radius:0 0 6px 6px;
  transition:height .8s ease;
}
.tank-fill.diesel  { background:linear-gradient(180deg,#60a5fa,#2563a8); }
.tank-fill.regular { background:linear-gradient(180deg,#4ade80,#16a34a); }
.tank-fill.premium { background:linear-gradient(180deg,#fbbf24,#b45309); }
.tank-fill.low     { background:linear-gradient(180deg,#fca5a5,#dc2626) !important; }
.tank-pct {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:13px; font-weight:800; color:var(--ink); text-shadow:0 1px 2px rgba(255,255,255,.8);
}
.tank-gal { font-size:12px; font-family:var(--mono); font-weight:600; text-align:center; color:var(--gray); }
.tank-cap { font-size:10px; color:#bbb; text-align:center; }
.tank-alert { font-size:10px; color:var(--fail); font-weight:700; text-align:center; }

/* ── Charts ── */
.chart-wrap { position:relative; height:180px; margin:4px 0; }
.chart-bars { display:flex; align-items:flex-end; gap:4px; height:150px; padding:0 4px; }
.chart-bar-group { display:flex; flex-direction:column; align-items:center; flex:1; gap:2px; }
.chart-bar { width:100%; border-radius:3px 3px 0 0; transition:height .4s ease; min-height:2px; cursor:pointer; }
.chart-bar:hover { opacity:.8; }
.chart-label { font-size:9px; color:var(--gray); text-align:center; margin-top:3px; white-space:nowrap; }
.chart-val { font-size:9px; font-weight:700; color:var(--ink); text-align:center; }
.chart-legend { display:flex; gap:12px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--gray); }
.legend-dot { width:8px; height:8px; border-radius:2px; flex-shrink:0; }
.mes-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.mes-stat { text-align:center; background:#f8fafc; border-radius:8px; padding:12px 8px; border:1px solid var(--border); }
.mes-stat .ms-val { font-size:18px; font-weight:800; font-family:var(--mono); color:var(--ink); }
.mes-stat .ms-lbl { font-size:10px; color:var(--gray); margin-top:3px; letter-spacing:.04em; text-transform:uppercase; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span style="font-size:20px;">&#9981;</span>
    <div>
      <div class="header-title">Reporte Diario</div>
      <div class="header-sub">Grifo &mdash; Para direccion</div>
    </div>
  </div>
  <div class="date-nav">
    <button onclick="changeDate(-1)">&#8249;</button>
    <input type="date" id="fecha-input" onchange="loadData()">
    <button onclick="changeDate(1)">&#8250;</button>
  </div>
</div>

<div class="container" id="main">
  <div class="state-msg"><div class="icon">&#9203;</div><div>Cargando...</div></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwYozaL1Ee9zOwh0fYS0ZsSQhMgkL-oZ1GbMnEMyubER850s4DtqvFp2JLP1_o0B3crnQ/exec";

function getToday() {
  const now  = new Date();
  const peru = new Date(now.getTime() - 5*60*60*1000);
  return peru.toISOString().split('T')[0];
}

function changeDate(d) {
  const inp = document.getElementById('fecha-input');
  const dt  = new Date(inp.value + 'T12:00:00');
  dt.setDate(dt.getDate() + d);
  inp.value = dt.toISOString().split('T')[0];
  loadData();
}

function fmt(n) {
  if (!n && n !== 0) return 'S/ --';
  return 'S/ ' + parseFloat(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtGal(n) { return (parseFloat(n)||0).toFixed(3); }
function pct(a, b) { return b ? Math.round((a/b)*100) : 0; }

var _histCache = null;

function loadData() {
  const fecha = document.getElementById('fecha-input').value;
  document.getElementById('main').innerHTML = '<div class="state-msg"><div class="icon">&#9203;</div><div>Cargando...</div></div>';

  // Remove previous JSONP scripts
  ['jsonp-daily','jsonp-hist'].forEach(function(id) {
    var el = document.getElementById(id); if (el) el.remove();
  });

  var dailyData = null;
  var dailyDone = false;
  var histDone  = _histCache !== null;

  function tryRender() {
    if (dailyDone && histDone) render(dailyData, fecha);
  }

  // Daily data
  window._dailyCallback = function(data) {
    dailyData = data; dailyDone = true; tryRender();
  };
  var s1 = document.createElement('script'); s1.id = 'jsonp-daily';
  s1.src = API + '?fecha=' + fecha + '&callback=_dailyCallback';
  s1.onerror = function() {
    document.getElementById('main').innerHTML = '<div class="state-msg"><div class="icon">&#10060;</div><div>Error al cargar datos.</div></div>';
  };
  document.body.appendChild(s1);

  // Historico (cached after first load)
  if (_histCache) { tryRender(); return; }
  window._histCallback = function(data) {
    _histCache = data; histDone = true; tryRender();
  };
  var s2 = document.createElement('script'); s2.id = 'jsonp-hist';
  s2.src = API + '?action=historico&dias=14&callback=_histCallback';
  document.body.appendChild(s2);
}

function renderTanks(varillas) {
  if (!varillas) return '';
  var tanks = [
    {key:'diesel1', label:'DIESEL', tipo:'diesel'},
    {key:'regular', label:'REGULAR',  tipo:'regular'},
    {key:'premium', label:'PREMIUM',  tipo:'premium'},
    {key:'diesel2', label:'DIESEL', tipo:'diesel'},
  ];
  var html = '<div class="card"><div class="card-header">Inventario de tanques (varilla)</div><div class="card-body"><div class="tanks-grid">';
  tanks.forEach(function(t) {
    var tank = varillas[t.key];
    if (!tank || tank.galones === null) {
      html += '<div class="tank-item"><div class="tank-label ' + t.tipo + '">' + t.label + '</div>';
      html += '<div class="tank-cap">—</div>';
      html += '<div class="tank-wrap"><div class="tank-body"></div></div>';
      html += '<div class="tank-gal" style="color:#bbb;">Sin lectura</div></div>';
      return;
    }
    var pct = tank.pct || 0;
    var isLow = pct < 20;
    var fillClass = 'tank-fill ' + t.tipo + (isLow ? ' low' : '');
    html += '<div class="tank-item">';
    html += '<div class="tank-label ' + t.tipo + '">' + t.label + '</div>';
    html += '<div class="tank-cap">~' + (Math.round(tank.cap/1000)*1000 || Math.round(tank.cap/100)*100) + ' gal</div>';
    html += '<div class="tank-wrap"><div class="tank-body">';
    html += '<div class="' + fillClass + '" style="height:' + pct + '%"></div>';
    html += '<div class="tank-pct">' + pct + '%</div>';
    html += '</div></div>';
    html += '<div class="tank-gal">' + tank.galones.toFixed(0) + ' gal</div>';
    if (isLow) html += '<div class="tank-alert">⚠️ Nivel bajo</div>';
    html += '</div>';
  });
  html += '</div></div></div>';
  return html;
}


function renderTendencias(hist) {
  if (!hist || !hist.dias || hist.dias.length < 1) return '';
  
  var dias = hist.dias;
  var mes  = hist.mes;
  
  // Format fecha for labels
  function fmtFecha(f) {
    var p = f.split('-');
    var meses = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    return p[2] + '/' + meses[parseInt(p[1])];
  }
  
  // Bar chart - venta total por dia
  var maxVenta = Math.max.apply(null, dias.map(function(d){return d.ventaTotal||0;})) || 1;
  
  var ventaBars = '';
  dias.forEach(function(d) {
    var h = Math.round((d.ventaTotal/maxVenta)*130);
    ventaBars += '<div class="chart-bar-group">';
    ventaBars += '<div class="chart-val" style="font-size:8px;">' + (d.ventaTotal > 0 ? ('S/'+Math.round(d.ventaTotal/1000)+'k') : '') + '</div>';
    ventaBars += '<div class="chart-bar" style="height:' + h + 'px;background:var(--diesel);" title="' + fmtFecha(d.fecha) + ': S/ ' + d.ventaTotal.toFixed(0) + '"></div>';
    ventaBars += '<div class="chart-label">' + fmtFecha(d.fecha) + '</div>';
    ventaBars += '</div>';
  });

  // Galones por combustible
  var maxGal = Math.max.apply(null, dias.map(function(d){
    return Math.max(d.galDiesel||0, d.galRegular||0, d.galPremium||0);
  })) || 1;

  var galBars = '';
  dias.forEach(function(d) {
    var hD = Math.round(((d.galDiesel||0)/maxGal)*120);
    var hR = Math.round(((d.galRegular||0)/maxGal)*120);
    var hP = Math.round(((d.galPremium||0)/maxGal)*120);
    galBars += '<div class="chart-bar-group">';
    galBars += '<div style="display:flex;gap:2px;align-items:flex-end;height:120px;">';
    galBars += '<div class="chart-bar" style="height:'+hD+'px;background:var(--diesel);flex:1;" title="Diesel: '+d.galDiesel.toFixed(0)+' gal"></div>';
    galBars += '<div class="chart-bar" style="height:'+hR+'px;background:var(--regular);flex:1;" title="Regular: '+d.galRegular.toFixed(0)+' gal"></div>';
    galBars += '<div class="chart-bar" style="height:'+hP+'px;background:var(--premium);flex:1;" title="Premium: '+d.galPremium.toFixed(0)+' gal"></div>';
    galBars += '</div>';
    galBars += '<div class="chart-label">' + fmtFecha(d.fecha) + '</div>';
    galBars += '</div>';
  });

  var html = '';
  
  // Resumen del mes
  html += '<div class="card">';
  html += '<div class="card-header">Resumen del mes</div>';
  html += '<div class="card-body"><div class="mes-grid">';
  html += '<div class="mes-stat"><div class="ms-val">' + fmt(mes.total) + '</div><div class="ms-lbl">Venta total</div></div>';
  html += '<div class="mes-stat"><div class="ms-val">' + mes.dias + '</div><div class="ms-lbl">D&iacute;as operados</div></div>';
  html += '<div class="mes-stat"><div class="ms-val" style="color:#7c3aed;">' + fmt(mes.creditos) + '</div><div class="ms-lbl">Cr&eacute;ditos dados</div></div>';
  html += '</div></div></div>';

  // Venta por dia
  html += '<div class="card">';
  html += '<div class="card-header">Venta diaria &mdash; &uacute;ltimos ' + dias.length + ' d&iacute;as</div>';
  html += '<div class="card-body"><div class="chart-bars">' + ventaBars + '</div></div>';
  html += '</div>';

  // Galones por dia
  html += '<div class="card">';
  html += '<div class="card-header">Galones despachados por d&iacute;a</div>';
  html += '<div class="card-body">';
  html += '<div class="chart-bars">' + galBars + '</div>';
  html += '<div class="chart-legend">';
  html += '<div class="legend-item"><div class="legend-dot" style="background:var(--diesel)"></div>Diesel</div>';
  html += '<div class="legend-item"><div class="legend-dot" style="background:var(--regular)"></div>Regular</div>';
  html += '<div class="legend-item"><div class="legend-dot" style="background:var(--premium)"></div>Premium</div>';
  html += '</div></div></div>';

  return html;
}

function toTitleCase(str) {
  if (!str) return '';
  return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function render(data, fecha) {
  if (!data.tieneDatos) {
    document.getElementById('main').innerHTML = '<div class="state-msg"><div class="icon">&#128233;</div><div>Sin reportes para esta fecha.</div></div>';
    return;
  }

  const t   = data.total;
  const ok  = data.todosCuadran;
  const dia   = data.turnos.find(x => x.turno === 'Dia' || x.turno === 'Día');
  const noche = data.turnos.find(x => x.turno === 'Noche');

  // Fuel bar widths
  const maxV = Math.max(t.ventaDiesel||0, t.ventaRegular||0, t.ventaPremium||0) || 1;

  // Format fecha nicely
  const [y,m,d2] = fecha.split('-');
  const meses = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const fechaLabel = d2 + ' ' + meses[parseInt(m)] + ' ' + y;

  let html = '';

  // Status banner
  const allDiff = data.turnos.filter(t => Math.abs(t.diferencia||0) >= 5);
  if (ok) {
    html += `<div class="status-banner ok"><div class="status-icon">&#10003;</div><div class="status-text"><h2>Cuadre correcto</h2><p>Todos los turnos del ${fechaLabel} cuadran correctamente.</p></div></div>`;
  } else {
    html += `<div class="status-banner fail"><div class="status-icon">&#9888;</div><div class="status-text"><h2>Hay diferencias en el cuadre</h2><p>${allDiff.length} turno(s) con diferencia &mdash; revisar detalle abajo.</p></div></div>`;
  }

  // Venta total
  html += `
  <div class="card">
    <div class="big-number">
      <div class="label">Venta total del d&iacute;a &mdash; ${fechaLabel}</div>
      <div class="value">${fmt(t.ventaTotal)}</div>
    </div>
    <div class="card-body">
      <div class="fuel-bars">
        <div class="fuel-row">
          <span class="fuel-lbl diesel">DIESEL</span>
          <div class="bar-wrap"><div class="bar diesel" style="width:${pct(t.ventaDiesel,maxV)}%"></div></div>
          <span class="fuel-amt">${fmt(t.ventaDiesel)}</span>
        </div>
        <div class="fuel-row">
          <span class="fuel-lbl regular">REGULAR</span>
          <div class="bar-wrap"><div class="bar regular" style="width:${pct(t.ventaRegular,maxV)}%"></div></div>
          <span class="fuel-amt">${fmt(t.ventaRegular)}</span>
        </div>
        <div class="fuel-row">
          <span class="fuel-lbl premium">PREMIUM</span>
          <div class="bar-wrap"><div class="bar premium" style="width:${pct(t.ventaPremium,maxV)}%"></div></div>
          <span class="fuel-amt">${fmt(t.ventaPremium)}</span>
        </div>
      </div>
    </div>
  </div>`;

  // Galones
  html += `
  <div class="card">
    <div class="card-header">Galones despachados</div>
    <div class="card-body">
      <div class="gal-grid">
        <div class="gal-item">
          <div class="gal-label diesel">DIESEL</div>
          <div class="gal-val">${fmtGal(t.galDiesel)}</div>
          <div class="gal-unit">galones</div>
        </div>
        <div class="gal-item">
          <div class="gal-label regular">REGULAR</div>
          <div class="gal-val">${fmtGal(t.galRegular)}</div>
          <div class="gal-unit">galones</div>
        </div>
        <div class="gal-item">
          <div class="gal-label premium">PREMIUM</div>
          <div class="gal-val">${fmtGal(t.galPremium)}</div>
          <div class="gal-unit">galones</div>
        </div>
      </div>
    </div>
  </div>`;

  // Medios de pago
  const totalPagos = (t.efectivo||0)+(t.visa||0)+(t.deposito||0)+(t.izipay||0)+(t.yape||0)+(t.creditos||0)+(t.almuerzo||0)+(t.gastos||0);
  html += `
  <div class="card">
    <div class="card-header">Medios de pago</div>
    <div class="card-body">
      <div class="pagos-grid">
        <div class="pago-item highlight"><span class="pago-label">Efectivo</span><span class="pago-val">${fmt(t.efectivo)}</span></div>
        <div class="pago-item"><span class="pago-label">Visa / Tarjeta</span><span class="pago-val">${fmt(t.visa)}</span></div>
        <div class="pago-item"><span class="pago-label">Dep&oacute;sito</span><span class="pago-val">${fmt(t.deposito)}</span></div>
        <div class="pago-item"><span class="pago-label">Izipay QR</span><span class="pago-val">${fmt(t.izipay)}</span></div>
        <div class="pago-item"><span class="pago-label">Yape BCP</span><span class="pago-val">${fmt(t.yape)}</span></div>
        <div class="pago-item"><span class="pago-label">Cr&eacute;ditos</span><span class="pago-val">${fmt(t.creditos)}</span></div>
        ${t.almuerzo ? `<div class="pago-item"><span class="pago-label">Almuerzo</span><span class="pago-val">${fmt(t.almuerzo)}</span></div>` : ''}
        ${t.gastos   ? `<div class="pago-item"><span class="pago-label">Gastos extra</span><span class="pago-val">${fmt(t.gastos)}</span></div>` : ''}
      </div>
    </div>
  </div>`;

  // Por turno
  html += `
  <div class="card">
    <div class="card-header">Detalle por turno</div>
    <div class="card-body">
      <div class="turnos-grid">
        ${renderTurno(dia, 'Turno D&iacute;a')}
        ${renderTurno(noche, 'Turno Noche')}
      </div>
    </div>
  </div>`;

  // Creditos detalle
  if (data.creditosTexto || t.creditos) {
    const items = data.creditosTexto ? data.creditosTexto.split('|').map(function(s){return s.trim();}).filter(Boolean) : [];
    var creditosHtml = '<div class="card"><div class="card-header">Cr&eacute;ditos del d&iacute;a &mdash; Total: ' + fmt(t.creditos) + '</div><div class="card-body">';
    if (items.length > 0) {
      items.forEach(function(item) {
        var montoMatch  = item.match(/S\/([\d.]+)/);
        var galMatch    = item.match(/([\d.]+)gal/);
        var combustMatch = item.match(/-(\s*)(Diesel|Regular|Premium)/i);
        var monto    = montoMatch  ? 'S/ ' + parseFloat(montoMatch[1]).toFixed(2) : '';
        var galones  = galMatch    ? galMatch[1] + ' gal' : '';
        var combust  = combustMatch ? combustMatch[2] : '';
        var nombre = item
          .replace(/\s*-\s*(Diesel|Regular|Premium)[^|]*/i, '')
          .replace(/S\/[\d.]+/, '')
          .replace(/[\d.]+gal/, '')
          .replace(/-$/, '')
          .trim();
        nombre = toTitleCase(nombre);
        var detalleRight = [combust, galones, monto].filter(Boolean).join(' ');
        creditosHtml += '<div style="padding:8px 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:12px;">';
        creditosHtml += '<span style="color:var(--ink);">' + nombre + '</span>';
        creditosHtml += '<span style="font-family:var(--mono);font-weight:700;color:#7c3aed;white-space:nowrap;">' + detalleRight + '</span>';
        creditosHtml += '</div>';
      });
    } else {
      creditosHtml += '<div style="font-size:12px;color:var(--gray);">Sin detalle registrado</div>';
    }
    creditosHtml += '</div></div>';
    html += creditosHtml;
  }

  // Gastos detalle
  if (data.gastosTexto || t.gastos) {
    const gitems = data.gastosTexto ? data.gastosTexto.split('|').map(function(s){return s.trim();}).filter(Boolean) : [];
    var gastosHtml = '<div class="card"><div class="card-header">Gastos extra del d&iacute;a &mdash; Total: ' + fmt(t.gastos) + '</div><div class="card-body">';
    if (gitems.length > 0) {
      gitems.forEach(function(item) {
        var parts  = item.split(' S/');
        var nombre = toTitleCase(parts[0].trim());
        var monto  = parts[1] ? 'S/ ' + parseFloat(parts[1]).toFixed(2) : '';
        gastosHtml += '<div style="padding:8px 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;font-size:13px;">';
        gastosHtml += '<span style="color:var(--ink);">' + nombre + '</span>';
        gastosHtml += '<span style="font-family:var(--mono);font-weight:700;color:#dc2626;">' + monto + '</span>';
        gastosHtml += '</div>';
      });
    } else {
      gastosHtml += '<div style="font-size:12px;color:var(--gray);">Sin detalle registrado</div>';
    }
    gastosHtml += '</div></div>';
    html += gastosHtml;
  }

  // Tendencias historicas
  if (_histCache) {
    html += renderTendencias(_histCache);
  }

  // Tanks at the end
  if (data.varillas) {
    html += renderTanks(data.varillas);
  }

  html += `<div class="footer">Actualizado autom&aacute;ticamente &bull; Grifo</div>`;
  document.getElementById('main').innerHTML = html;
}

function renderTurno(t, label) {
  if (!t) return `<div class="turno-card empty"><div class="turno-title">${label}</div><div style="font-size:12px;color:var(--gray);">Sin reporte</div></div>`;
  const cuadra = Math.abs(t.diferencia||0) < 5;
  return `
  <div class="turno-card ${cuadra?'ok':'fail'}">
    <div class="turno-title">${label}</div>
    <div class="turno-stat"><span class="lbl">Venta</span><span class="val">${fmt(t.ventaTotal)}</span></div>
    <div class="turno-stat"><span class="lbl">Diesel</span><span class="val">${fmtGal(t.galDieselReal)} gal</span></div>
    <div class="turno-stat"><span class="lbl">Regular</span><span class="val">${fmtGal(t.galRegularReal)} gal</span></div>
    <div class="turno-stat"><span class="lbl">Premium</span><span class="val">${fmtGal(t.galPremiumReal)} gal</span></div>
    <div class="turno-stat"><span class="lbl">Cobrado</span><span class="val">${fmt(t.totalCobrado)}</span></div>
    <span class="turno-badge ${cuadra?'ok':'fail'}">${cuadra?'&#10003; Cuadra':'&#10007; Dif. '+fmt(Math.abs(t.diferencia))}</span>
  </div>`;
}

document.getElementById('fecha-input').value = getToday();
loadData();
</script>
</body>
</html>
